
 name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/asimtech/caller
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name='AsimTechCaller'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.asimtech.caller'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.asimtech.caller'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Asim Tech Caller"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".CallerScreeningService"
                      android:permission="android.permission.BIND_SCREENING_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService"/>
                      </intent-filter>

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/asimtech/caller/MainActivity.java <<'EOF'
          package com.asimtech.caller;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.graphics.Color;

          public class MainActivity extends Activity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);

                  webView.setBackgroundColor(Color.WHITE);
                  webView.setWebViewClient(new WebViewClient());

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);

                  webView.loadUrl(
                      "https://asim75772.github.io/caller-id-app/"
                  );

                  setContentView(webView);
              }
          }
          EOF

          cat > app/src/main/java/com/asimtech/caller/CallerScreeningService.java <<'EOF'
          package com.asimtech.caller;

          import android.telecom.Call;
          import android.telecom.CallScreeningService;
          import android.telecom.Call.Details;
          import android.net.Uri;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.os.Build;

          public class CallerScreeningService extends CallScreeningService {

              private static final String CHANNEL_ID = "caller_alert";

              @Override
              public void onScreenCall(Call.Details callDetails) {

                  Uri handle = callDetails.getHandle();

                  if (handle == null) {
                      respondToCall(
                          callDetails,
                          new CallResponse.Builder().build()
                      );
                      return;
                  }

                  String number = handle.getSchemeSpecificPart();

                  if (number == null) {
                      respondToCall(
                          callDetails,
                          new CallResponse.Builder().build()
                      );
                      return;
                  }

                  number = number.replaceAll("[^0-9+]", "");

                  showCallerNotification(number);

                  respondToCall(
                      callDetails,
                      new CallResponse.Builder().build()
                  );
              }

              private void showCallerNotification(String number) {

                  NotificationManager manager =
                      (NotificationManager)
                      getSystemService(Context.NOTIFICATION_SERVICE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "Asim Tech Caller",
                              NotificationManager.IMPORTANCE_HIGH
                          );

                      channel.setDescription(
                          "Incoming caller identification"
                      );

                      manager.createNotificationChannel(channel);
                  }

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      builder = new Notification.Builder(
                          this,
                          CHANNEL_ID
                      );
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  builder
                      .setSmallIcon(android.R.drawable.sym_call_incoming)
                      .setContentTitle("Asim Tech Caller")
                      .setContentText(
                          "Incoming call: " + number
                      )
                      .setStyle(
                          new Notification.BigTextStyle()
                              .bigText(
                                  "Incoming call from " +
                                  number +
                                  "\n\nCheck Asim Tech Caller for caller information."
                              )
                      )
                      .setAutoCancel(true)
                      .setPriority(Notification.PRIORITY_HIGH);

                  manager.notify(
                      9871,
                      builder.build()
                  );
              }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

          ./gradle-8.7/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asim-Tech-Caller-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
