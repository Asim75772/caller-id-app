name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/asimtech/caller
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'AsimTechCaller'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.asimtech.caller'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.asimtech.caller'
                  minSdk 29
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Asim Tech Caller"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".CallerScreeningService"
                      android:permission="android.permission.BIND_SCREENING_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService" />
                      </intent-filter>

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/asimtech/caller/MainActivity.java <<'EOF'
          package com.asimtech.caller;

          import android.app.Activity;
          import android.app.role.RoleManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final int ROLE_REQUEST_CODE = 1001;
              private static final int NOTIFICATION_REQUEST_CODE = 2001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("Asim Tech Caller");
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(10, 20, 10, 20);

                  Button enableButton = new Button(this);
                  enableButton.setText("ENABLE CALLER ID");

                  enableButton.setOnClickListener(v -> {
                      requestNotificationPermission();
                      requestCallScreeningRole();
                  });

                  layout.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  layout.addView(
                      enableButton,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  WebView webView = new WebView(this);

                  webView.setWebViewClient(new WebViewClient());

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);

                  webView.loadUrl(
                      "https://asim75772.github.io/caller-id-app/"
                  );

                  layout.addView(
                      webView,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  setContentView(layout);

                  requestNotificationPermission();
              }

              private void requestCallScreeningRole() {

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {

                      Toast.makeText(
                          this,
                          "Android 10 or higher is required",
                          Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  RoleManager roleManager =
                      (RoleManager) getSystemService(ROLE_SERVICE);

                  if (roleManager == null) {

                      Toast.makeText(
                          this,
                          "Role Manager is not available",
                          Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  boolean available =
                      roleManager.isRoleAvailable(
                          RoleManager.ROLE_CALL_SCREENING
                      );

                  if (!available) {

                      Toast.makeText(
                          this,
                          "Call Screening is not available on this phone",
                          Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  boolean alreadyEnabled =
                      roleManager.isRoleHeld(
                          RoleManager.ROLE_CALL_SCREENING
                      );

                  if (alreadyEnabled) {

                      Toast.makeText(
                          this,
                          "Caller ID is already enabled",
                          Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  Intent intent =
                      roleManager.createRequestRoleIntent(
                          RoleManager.ROLE_CALL_SCREENING
                      );

                  startActivityForResult(
                      intent,
                      ROLE_REQUEST_CODE
                  );
              }

              private void requestNotificationPermission() {

                  if (Build.VERSION.SDK_INT >= 33) {

                      if (checkSelfPermission(
                              "android.permission.POST_NOTIFICATIONS")
                              != PackageManager.PERMISSION_GRANTED) {

                          requestPermissions(
                              new String[] {
                                  "android.permission.POST_NOTIFICATIONS"
                              },
                              NOTIFICATION_REQUEST_CODE
                          );
                      }
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == ROLE_REQUEST_CODE) {

                      if (resultCode == RESULT_OK) {

                          Toast.makeText(
                              this,
                              "Caller ID Enabled Successfully",
                              Toast.LENGTH_LONG
                          ).show();

                      } else {

                          Toast.makeText(
                              this,
                              "Caller ID permission was not enabled",
                              Toast.LENGTH_LONG
                          ).show();
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/asimtech/caller/CallerScreeningService.java <<'EOF'
          package com.asimtech.caller;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.telecom.Call;
          import android.telecom.CallScreeningService;

          public class CallerScreeningService
                  extends CallScreeningService {

              private static final String CHANNEL_ID =
                  "asim_tech_caller_alert";

              @Override
              public void onScreenCall(Call.Details callDetails) {

                  Uri handle = callDetails.getHandle();

                  if (handle == null) {
                      respondToCall(
                          callDetails,
                          new CallResponse.Builder().build()
                      );
                      return;
                  }

                  String number =
                      handle.getSchemeSpecificPart();

                  if (number == null) {
                      respondToCall(
                          callDetails,
                          new CallResponse.Builder().build()
                      );
                      return;
                  }

                  number = number.replaceAll(
                      "[^0-9+]",
                      ""
                  );

                  showCallerNotification(number);

                  respondToCall(
                      callDetails,
                      new CallResponse.Builder().build()
                  );
              }

              private void showCallerNotification(
                      String number) {

                  NotificationManager manager =
                      (NotificationManager)
                      getSystemService(
                          Context.NOTIFICATION_SERVICE
                      );

                  if (manager == null) {
                      return;
                  }

                  if (Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "Asim Tech Caller",
                              NotificationManager.IMPORTANCE_HIGH
                          );

                      channel.setDescription(
                          "Incoming caller identification"
                      );

                      manager.createNotificationChannel(
                          channel
                      );
                  }

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O) {

                      builder =
                          new Notification.Builder(
                              this,
                              CHANNEL_ID
                          );

                  } else {

                      builder =
                          new Notification.Builder(this);
                  }

                  builder
                      .setSmallIcon(
                          android.R.drawable.sym_call_incoming
                      )
                      .setContentTitle(
                          "Asim Tech Caller"
                      )
                      .setContentText(
                          "Incoming call " + number
                      )
                      .setStyle(
                          new Notification.BigTextStyle()
                              .bigText(
                                  "Incoming call from "
                                  + number
                                  + "\n\n"
                                  + "Open Asim Tech Caller "
                                  + "to check caller information."
                              )
                      )
                      .setAutoCancel(true)
                      .setPriority(
                          Notification.PRIORITY_HIGH
                      );

                  manager.notify(
                      9871,
                      builder.build()
                  );
              }
          }
          EOF

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

          ./gradle-8.7/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asim-Tech-Caller-APK-v4
          path: app/build/outputs/apk/debug/app-debug.apk
